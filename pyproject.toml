[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ocr-pdf"
version = "0.1.0"
description = "Cross-platform CLI utility to transform unsearchable/scanned PDFs into text-searchable files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OCR-PDF Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: Recognition :: OCR",
]
dependencies = [
    "click>=8.1.0",
    "tqdm>=4.65.0",
    "ocrmypdf>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
ocr-pdf = "ocr_pdf.cli:cli"

[tool.setuptools.packages.find]
include = ["ocr_pdf*"]
